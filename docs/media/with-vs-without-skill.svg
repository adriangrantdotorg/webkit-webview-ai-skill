<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The same bug report with and without the skill: without it, four tries; with it, one try and time to spare</title>
  <rect x="1" y="1" width="958" height="318" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <!-- The request -->
  <rect x="20" y="30" width="204" height="240" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="122" y="62" fill="#8b949e" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">YOU ASK</text>
  <text x="122" y="112" fill="#e6edf3" font-size="16" text-anchor="middle">“The ✕ button</text>
  <text x="122" y="138" fill="#e6edf3" font-size="16" text-anchor="middle">works in Chrome</text>
  <text x="122" y="164" fill="#e6edf3" font-size="16" text-anchor="middle">but does nothing</text>
  <text x="122" y="190" fill="#e6edf3" font-size="16" text-anchor="middle">in my Mac app.”</text>

  <!-- Without lane -->
  <rect x="240" y="30" width="700" height="110" rx="10" fill="#2a1517" stroke="#f85149" stroke-width="1.5"/>
  <text x="256" y="54" fill="#ff7b72" font-size="13" font-weight="700" letter-spacing="1">WITHOUT THE SKILL</text>
  <rect x="256" y="72" width="130" height="44" rx="8" fill="#3d1d20" stroke="#f85149"/>
  <text x="321" y="99" fill="#ffdcd7" font-size="14" font-weight="700" text-anchor="middle">Checks the CSS</text>
  <rect x="396" y="72" width="140" height="44" rx="8" fill="#3d1d20" stroke="#f85149"/>
  <text x="466" y="99" fill="#ffdcd7" font-size="14" font-weight="700" text-anchor="middle">Tests in Chrome</text>
  <rect x="546" y="72" width="155" height="44" rx="8" fill="#3d1d20" stroke="#f85149"/>
  <text x="623" y="99" fill="#ffdcd7" font-size="14" font-weight="700" text-anchor="middle">Patches the click</text>
  <rect x="711" y="72" width="125" height="44" rx="8" fill="#3b2a10" stroke="#d29922"/>
  <text x="773" y="99" fill="#f2cc60" font-size="14" font-weight="700" text-anchor="middle">Works · try 4</text>

  <!-- With lane -->
  <rect x="240" y="160" width="700" height="110" rx="10" fill="#12261b" stroke="#3fb950" stroke-width="1.5"/>
  <text x="256" y="184" fill="#56d364" font-size="13" font-weight="700" letter-spacing="1">WITH THE SKILL</text>
  <rect x="256" y="202" width="150" height="44" rx="8" fill="#1a3a26" stroke="#3fb950"/>
  <text x="331" y="229" fill="#d2f8dc" font-size="14" font-weight="700" text-anchor="middle">Matches gotcha 7</text>
  <rect x="416" y="202" width="125" height="44" rx="8" fill="#1a3a26" stroke="#3fb950"/>
  <text x="478" y="229" fill="#d2f8dc" font-size="14" font-weight="700" text-anchor="middle">Sets one flag</text>
  <rect x="551" y="202" width="125" height="44" rx="8" fill="#1f5130" stroke="#56d364" stroke-width="1.5"/>
  <text x="613" y="229" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Works · try 1</text>
  <rect x="686" y="178" width="238" height="80" rx="8" fill="none" stroke="#56d364" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="805" y="213" fill="#56d364" font-size="15" font-weight="700" text-anchor="middle">Time you get back</text>
  <text x="805" y="236" fill="#8bd5a0" font-size="12" text-anchor="middle">no guessing, no retries</text>

  <!-- Time arrow -->
  <line x1="240" y1="294" x2="928" y2="294" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="938,294 926,288 926,300" fill="#8b949e"/>
  <text x="248" y="312" fill="#8b949e" font-size="12">time →</text>
</svg>
